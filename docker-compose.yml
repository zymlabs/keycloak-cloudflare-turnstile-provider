services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak

    ports:
      - 5432:5432

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 2s
      timeout: 5s
      retries: 30

  mailpit:
    # Catches Keycloak's emails (reset-password links in the e2e tests). Web UI and API on 8025.
    image: axllent/mailpit:v1.31
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"

  keycloak:
    # Override to test other versions, e.g. KEYCLOAK_VERSION=24.0.0 docker compose up
    image: quay.io/keycloak/keycloak:${KEYCLOAK_VERSION:-26.7.4}
    # start-dev runs an implicit build, so providers and themes in /opt/keycloak/providers are picked up
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak

      # Admin user: KC_BOOTSTRAP_ADMIN_* for Keycloak 26+, KEYCLOAK_ADMIN* for 24/25
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin

      KC_HTTP_ENABLED: 'true'
      # The realm settings tab (Realm settings > Cloudflare Turnstile) is a declarative-UI tab
      KC_FEATURES: declarative-ui
      KC_HOSTNAME_STRICT: 'false'
      KC_LOG_LEVEL: INFO,com.zymlabs.keycloak.cloudflare.turnstileprovider:debug

      DEBUG: 'true'
      # DEBUG_SUSPEND: 'y' # Wait for debugger to connect before starting Keycloak
      DEBUG_PORT: '*:5005'

    ports:
      - 8080:8080   # HTTP
      - 5005:5005   # Debug port

    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started

    # The official image has no curl; probe the master realm over bash's /dev/tcp instead.
    # /realms/master is served on port 8080 on every supported version (health moved to 9000 in 25).
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /realms/master HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q ' 200'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

    volumes:
      - ./target/zymlabs-cloudflare-turnstile-provider.jar:/opt/keycloak/providers/zymlabs-cloudflare-turnstile-provider.jar:ro
      - ./examples/realms:/opt/keycloak/data/import:ro

  keycloak-init:
    image: curlimages/curl:8.16.0
    depends_on:
      keycloak:
        condition: service_healthy
    volumes:
      - ./docker/init-keycloak.sh:/init-keycloak.sh:ro
    entrypoint: ["/bin/sh", "/init-keycloak.sh"]
    restart: "no"
