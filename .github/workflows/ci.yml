name: CI/CD

on:
  push:
    branches:
      - '**'
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  pull_request:
    branches:
      - '**'

env:
  JAVA_VERSION: '17'
  JAVA_DISTRIBUTION: 'temurin'
  NODE_VERSION: '22'

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    outputs:
      semver: ${{ steps.gitversion.outputs.semVer }}
      fullsemver: ${{ steps.gitversion.outputs.fullSemVer }}
      major: ${{ steps.gitversion.outputs.major }}
      minor: ${{ steps.gitversion.outputs.minor }}
      patch: ${{ steps.gitversion.outputs.patch }}
      prerelease: ${{ steps.gitversion.outputs.preReleaseTag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Full history required for GitVersion

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v0
        with:
          versionSpec: '5.x'

      - name: Determine Version
        id: gitversion
        uses: gittools/actions/gitversion/execute@v0
        with:
          useConfigFile: true
          configFilePath: GitVersion.yml

      - name: Display GitVersion outputs
        run: |
          echo "SemVer: ${{ steps.gitversion.outputs.semVer }}"
          echo "FullSemVer: ${{ steps.gitversion.outputs.fullSemVer }}"
          echo "Major: ${{ steps.gitversion.outputs.major }}"
          echo "Minor: ${{ steps.gitversion.outputs.minor }}"
          echo "Patch: ${{ steps.gitversion.outputs.patch }}"
          echo "PreReleaseTag: ${{ steps.gitversion.outputs.preReleaseTag }}"

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v6
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: maven

      - name: Update pom.xml version
        run: |
          mvn versions:set -DnewVersion=${{ steps.gitversion.outputs.semVer }} -DgenerateBackupPoms=false
          echo "Updated pom.xml to version ${{ steps.gitversion.outputs.semVer }}"

      - name: Run tests
        run: mvn clean test

      - name: Build JAR
        run: mvn package -DskipTests

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: keycloak-cloudflare-turnstile-${{ steps.gitversion.outputs.semVer }}
          path: target/*.jar
          retention-days: 5

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: target/surefire-reports/
          retention-days: 5

  compatibility:
    name: Unit Tests (Keycloak ${{ matrix.keycloak }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Oldest supported, last 25.x, and the version the pom targets. Keep 24.0.0 as the floor.
        keycloak: ['24.0.0', '25.0.6', '26.7.4']

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v6
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: maven

      # Catches use of Keycloak APIs that don't exist in older versions (and Jackson/Hibernate drift)
      - name: Compile and test against Keycloak ${{ matrix.keycloak }}
        run: mvn -B clean test -Dkeycloak.version=${{ matrix.keycloak }}

  e2e:
    name: E2E Tests (Keycloak ${{ matrix.keycloak }})
    runs-on: ubuntu-latest
    needs: build-and-test
    strategy:
      fail-fast: false
      matrix:
        keycloak: ['24.0.0', '25.0.6', '26.7.4']

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Test the exact jar that gets released, not one rebuilt per Keycloak version
      - name: Download provider JAR
        uses: actions/download-artifact@v8
        with:
          name: keycloak-cloudflare-turnstile-${{ needs.build-and-test.outputs.semver }}
          path: target

      - name: Start Keycloak ${{ matrix.keycloak }}
        env:
          KEYCLOAK_VERSION: ${{ matrix.keycloak }}
        run: docker compose up -d --wait --wait-timeout 300 keycloak

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run Playwright tests
        working-directory: e2e
        run: npx playwright test

      # Exercises the JPA entity against each version's Hibernate
      - name: Verify verification records were persisted
        run: |
          COUNT=$(docker compose exec -T postgres psql -U keycloak -d keycloak -tAc "select count(*) from cloudflare_turnstile_check")
          echo "cloudflare_turnstile_check rows: $COUNT"
          test "$COUNT" -gt 0

      - name: Keycloak logs
        if: failure()
        run: docker compose logs keycloak

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-keycloak-${{ matrix.keycloak }}
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7

  develop-release:
    name: Develop Pre-Release
    runs-on: ubuntu-latest
    needs: [build-and-test, compatibility, e2e]
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v0
        with:
          versionSpec: '5.x'

      - name: Determine Version
        id: gitversion
        uses: gittools/actions/gitversion/execute@v0
        with:
          useConfigFile: true
          configFilePath: GitVersion.yml

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v6
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: maven

      - name: Update pom.xml version
        run: mvn versions:set -DnewVersion=${{ steps.gitversion.outputs.semVer }} -DgenerateBackupPoms=false

      - name: Build JAR
        run: mvn clean package -DskipTests

      - name: Rename JAR
        run: |
          mv target/zymlabs-cloudflare-turnstile-provider.jar target/zymlabs-cloudflare-turnstile-provider-${{ steps.gitversion.outputs.semVer }}.jar

      - name: Delete old pre-releases
        uses: actions/github-script@v9
        with:
          script: |
            const releases = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo,
            });

            const preReleases = releases.data.filter(r => r.prerelease && r.tag_name.includes('alpha'));

            // Keep only the 5 most recent pre-releases
            const toDelete = preReleases.slice(5);

            for (const release of toDelete) {
              console.log(`Deleting old pre-release: ${release.tag_name}`);
              await github.rest.repos.deleteRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: release.id,
              });

              // Also delete the tag
              try {
                await github.rest.git.deleteRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: `tags/${release.tag_name}`,
                });
              } catch (error) {
                console.log(`Could not delete tag ${release.tag_name}: ${error.message}`);
              }
            }

      - name: Create Pre-Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.gitversion.outputs.semVer }}
          name: Development Build ${{ steps.gitversion.outputs.semVer }}
          body: |
            **Automated development build from `develop` branch**

            - Version: `${{ steps.gitversion.outputs.semVer }}`
            - Commit: ${{ github.sha }}
            - Branch: ${{ github.ref_name }}

            This is a pre-release build for testing purposes. Use stable releases for production.
          files: target/zymlabs-cloudflare-turnstile-provider-${{ steps.gitversion.outputs.semVer }}.jar
          prerelease: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  tagged-release:
    name: Production Release
    runs-on: ubuntu-latest
    needs: [build-and-test, compatibility, e2e]
    if: startsWith(github.ref, 'refs/tags/') && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v0
        with:
          versionSpec: '5.x'

      - name: Determine Version
        id: gitversion
        uses: gittools/actions/gitversion/execute@v0
        with:
          useConfigFile: true
          configFilePath: GitVersion.yml

      - name: Validate tag matches version
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/}"
          GITVERSION="${{ steps.gitversion.outputs.semVer }}"

          if [ "$TAG_VERSION" != "$GITVERSION" ]; then
            echo "Error: Tag version ($TAG_VERSION) does not match GitVersion ($GITVERSION)"
            exit 1
          fi

          echo "Version validated: $TAG_VERSION"

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v6
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: maven

      - name: Update pom.xml version
        run: mvn versions:set -DnewVersion=${{ steps.gitversion.outputs.semVer }} -DgenerateBackupPoms=false

      - name: Build JAR
        run: mvn clean package -DskipTests

      - name: Rename JAR
        run: |
          mv target/zymlabs-cloudflare-turnstile-provider.jar target/zymlabs-cloudflare-turnstile-provider-${{ steps.gitversion.outputs.semVer }}.jar

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          name: Release ${{ steps.gitversion.outputs.semVer }}
          body: |
            **Production release ${{ steps.gitversion.outputs.semVer }}**

            See [CHANGELOG.md](CHANGELOG.md) for details.

            ## Installation

            Download `zymlabs-cloudflare-turnstile-provider-${{ steps.gitversion.outputs.semVer }}.jar` and copy to your Keycloak providers directory:

            ```bash
            cp zymlabs-cloudflare-turnstile-provider-${{ steps.gitversion.outputs.semVer }}.jar /path/to/keycloak/providers/
            bin/kc.sh build
            bin/kc.sh start
            ```
          files: target/zymlabs-cloudflare-turnstile-provider-${{ steps.gitversion.outputs.semVer }}.jar
          prerelease: false
          draft: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
