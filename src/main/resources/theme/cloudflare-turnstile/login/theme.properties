# Cloudflare Turnstile Theme - Modern Variant (PatternFly 5)
#
# This theme extends keycloak.v2 with native Turnstile CAPTCHA integration.
# Requires Keycloak 26+ (uses keycloak.v2 templates such as field.ftl that 25 lacks)
#
# Based on: Keycloak 26.0.0 keycloak.v2 theme
# Last updated: 2024-11-20
#
# Features:
# - Native Turnstile widget integration in login and registration forms
# - PatternFly 5 compatible styling
# - Dark mode support
# - Shared resources via common/cloudflare-turnstile import
#
# For Keycloak 24.x and 25.x, use cloudflare-turnstile-legacy theme instead.
