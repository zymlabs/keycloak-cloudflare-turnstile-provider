parent=keycloak
import=common/cloudflare-turnstile

##
## Cloudflare Turnstile Theme - Legacy Variant (PatternFly 3/4)
##
## Based on: Keycloak 24.0.0 keycloak (v1) base theme
## CSS Framework: PatternFly 3/4 + Bootstrap Grid
## Last updated: 2024-11-22
##
## Features:
## - Native Turnstile widget integration in login and registration forms
## - Complete CSS class property definitions for all Keycloak login pages
## - PatternFly 3/4 compatible styling
## - Shared resources via common/cloudflare-turnstile import
##
## Note: The classic keycloak theme is deprecated in Keycloak 26+
## For Keycloak 25+, use the cloudflare-turnstile theme instead.
##

